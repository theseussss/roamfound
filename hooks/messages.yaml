  layer: framework_state
  category: framework_update_check
  audience: assistant_runtime
  response_policy: use_for_project_state
  requires_action: true
  action_type: check_framework_update
  preserve_text: true
  text: "Framework 更新检查：每轮都要检查本轮内容是否影响项目级 Framework。检查结果归为四类之一：无需更新 / 候选进 scratch / 提出更新方案 / 已获批更新。按 scratch 维护模式处理：若本轮只产生讨论过程、疑问、临时判断或未稳定变化，先写入当前 topic/scratch，必要时标记为 Framework 候选；若候选已经稳定、可跨话题复用，并会改变项目级最高压缩层，先提出更新方案，说明应归入 Vision（目标、完成样态、验收标准）、Structure（目录、模块、对象关系、codemap）、Style（文风、界面手感、呈现规范）还是 Trace（任务链、问题链、修复链、决策链）；只有用户确认后，才维护 doc/Framework/ 对应主文件。"
