session.unsafe_candidate:
  text: "当前目录属于未确认候选目录：{candidate_root}。在完成项目根确认前，不能进入项目治理流程，不能写入项目记录，不能启动后台监听。"
session.candidate_init:
  text: "当前根尚未建档：{candidate_root}。AI 只有提议权；如需建档，必须先由用户确认建档位置和套餐。"
