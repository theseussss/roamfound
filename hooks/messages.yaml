  text: "当前话题： {root} > {parent} > {focus_value} · {status}"
focus.classify_required:
  sender: hook
  source: jiacong-flow-hook
  layer: routing_policy
  category: focus_classification
  audience: assistant_runtime
  response_policy: use_for_routing
  requires_action: true
  action_type: classify_focus
  preserve_text: true
  text: "此消息在话题 {focus_value}范畴内吗？必须先回复属于哪一种路由类型并完整输出理由：延续 | 侧写 | 切焦点 | 需询问。回复开头必须逐项严肃诚实判断：1 当前未切换的话题正在回答的问题边界是？；2 真实用户消息正在提出的问题是？用户消息在旧话题边界内的概率和模型的信心是多少？给出一个具体评分（0-100），若不确定，宁问不动；3.根据得分分析路由类型；"
focus.classify_options:
  sender: hook
  source: jiacong-flow-hook
  layer: routing_policy
  category: focus_classification_options
  audience: assistant_runtime
  response_policy: use_for_routing
  preserve_text: true
  text: "延续：得分高，且模型足够自信判定真实用户消息仍在当前原子话题的问题边界内，写当前话题的scratch | 侧写：得分低，且模型足够自信判定消息不在当前话题但并非主线，同时出现可索引到其他话题的材料，写目标话题的 scratch 并双向索引在本话题scratch | 切焦点：得分低，且模型自信判定真实用户消息已经进入另一个完整话题，或需要新建边界更清楚的原子话题；先确定目标话题编号，把 .jiacong/focus.json 写成合法 JSON（schema_version/topic_id/source），必要时新建话题，禁止把话题名写成无法自明的过于抽象的命名，话题名不限字数。然后签退log→签到log→写目标 scratch | 需询问：无论得分高低，但模型自信程度较低，或对象、边界、写入位置不清楚，必须先问用户确认，不写 scratch"
