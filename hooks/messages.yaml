# User-visible hook text. Keep all hook wording here so CLI protocols and
# lifecycle checks can change without chasing scattered strings in event files.

root.unsafe.home:
  text: |
    当前目录：{cwd}（Home 目录）

    扫描结果：
    - cwd 来源：{cwd_source}（可信度：{cwd_confidence}）
    - 确认标记：{marker_status_display}
    - 旧项目管理痕迹：{legacy_traces_display}
    - 结构特征：{structure_features_display}
    - 下一层：{children_summary}
    {has_confirmed_subdirs_note}

    硬性约束（不可协商）：
    - 不能在 Home 目录创建 .jiacong/project.json
    - 不能把旧痕迹当作项目根授权依据
    - 不能进入项目治理流程，不能写入项目记录，不能启动后台监听
    - 不能擅自迁移旧痕迹
    - 可以临时回答用户问题

    你的职责：当用户请求涉及项目管理、建档、焦点、记录、后台监听或文件写入时，先说明当前目录状态和权限边界；若用户只是普通问答，可以临时回答，但不得产生项目治理副作用。

root.unsafe.root:
  text: |
    当前目录：{cwd}（文件系统根目录）

    硬性约束（不可协商）：禁止在文件系统根目录进行任何项目管理操作；禁止创建 .jiacong/project.json；禁止进入项目治理流程、写入项目记录或启动后台监听。只能临时回答用户问题。

root.unsafe.mount:
  text: |
    当前目录：{cwd}（浅层挂载点）

    扫描结果：
    - cwd 来源：{cwd_source}（可信度：{cwd_confidence}）
    - 确认标记：{marker_status_display}
    - 旧项目管理痕迹：{legacy_traces_display}
    - 结构特征：{structure_features_display}
    - 下一层：{children_summary}
    {has_confirmed_subdirs_note}

    硬性约束（不可协商）：不能以浅层挂载点本身作为项目根；不能进入项目治理流程，不能写入项目记录，不能启动后台监听。可以建议用户切换到子目录中的已确认项目，但不能自动切换或自动启用治理。

root.needs_judgment:
  text: |
    当前目录尚未确认为项目根。

    扫描事实：
    - 当前目录：{cwd}
    - 目录名称：{dirname}
    - cwd 来源：{cwd_source}（可信度：{cwd_confidence}）
    - 确认标记：{marker_status_display}
    - 旧项目管理痕迹：{legacy_traces_display}
    - 结构特征：{structure_features_display}
    - 特殊目录类型：{special_dir_display}
    - 上一层确认标记：{parent_has_confirmed_marker_display}
    - 上一层旧痕迹：{parent_legacy_traces_display}
    - 上一层结构特征：{parent_structure_features_display}
    - 下一层：{children_summary}
    {has_confirmed_subdirs_note}

    权限边界：AI 只有提议权，没有决策权；不能擅自创建 .jiacong/project.json，不能擅自启用项目治理，不能擅自迁移旧痕迹。只有用户明确确认后才能执行建档、迁移或套餐选择。

    AI 职责：根据目录名、项目线索、旧痕迹、特殊目录、上中下三层结构关系判断是否值得建档，并向用户提出方案；workspace/单项目只是建档套餐选项，不是扫描分类。

root.workspace_no_selection:
  text: "当前目录包含 workspace 结构线索，但是否采用 workspace 模式需要用户决策；在确认项目根前，不能进入项目治理流程。"
root.legacy_confirm:
  text: "检测到 AI 协作或旧项目管理痕迹：{candidate_root}，但未发现有效 .jiacong/project.json；这些痕迹只能作为线索，不能作为项目根授权依据。"
root.unsafe_candidate:
  text: "当前目录属于未确认候选目录：{candidate_root}。在完成项目根确认前，不能进入项目治理流程，不能写入项目记录，不能启动后台监听。"
root.candidate_init:
  text: "当前目录尚未建档：{candidate_root}。AI 只有提议权；如需建档，必须先由用户确认建档位置和套餐。"

