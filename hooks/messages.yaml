source.layer_classification:
  sender: hook
  source: jiacong-flow-hook
  layer: project_context
  category: source_layer_classification
  audience: assistant_runtime
  response_policy: use_for_project_state
  requires_action: true
  action_type: classify_source_layer
  preserve_text: true
  text: "文件操作前先判断改动层级：管理层 / 内容层 / 混合。管理层=项目治理与AI协作记录，如 .jiacong/、topics/、logs/、doc/Framework/、入口文档；内容层=真实交付物或源码，如 source/main/<source_dir>/、source/worktrees/、源码/正文/HTML/产物。混合改动必须拆提交：先提交内容层，再提交管理层记录；运行态和生成态默认不提交。若项目存在 .jiacong/source.json，先按其中 source_root/source_dir 判断内容层位置；若不存在，按当前 cwd 和显式路径判断。"

focus.missing.header:
