session.unsafe.root:
  text: |
    当前目录：{cwd}（文件系统根目录）
    扫描事实：目录来源={cwd_source}/{cwd_confidence}。
    硬性约束：禁止在文件系统根目录进行任何项目管理操作；不能创建 .jiacong/project.json；不能进入项目治理流程，不能写入项目记录，不能启动后台监听。普通问答可临时回答。

session.unsafe.mount:
  text: |
    当前目录：{cwd}（浅层挂载点）
    扫描事实：目录来源={cwd_source}/{cwd_confidence}；确认标记={marker_status_display}；旧痕迹={legacy_traces_display}；结构特征={structure_features_display}；下一层={children_summary}。
    {has_confirmed_subdirs_note}
    硬性约束：不能以浅层挂载点本身作为项目根；不能进入项目治理流程，不能写入项目记录，不能启动后台监听。可以建议切换到子目录中的已确认项目，但不能自动切换或自动启用治理。

session.needs_judgment:
  text: |
    当前目录尚未确认为项目根。扫描事实：cwd={cwd}；来源={cwd_source}/{cwd_confidence}；确认标记={marker_status_display}；旧痕迹={legacy_traces_display}；结构特征={structure_features_display}；特殊目录={special_dir_display}；上一层确认={parent_has_confirmed_marker_display}；下一层={children_summary}。
    {has_confirmed_subdirs_note}
    权限边界：AI 只有提议权，没有决策权；在用户明确确认前，不能建档、不能启用项目治理、不能迁移旧痕迹。workspace/单项目只是建档套餐选项，不是扫描分类。

session.unmanaged.followup:
  text: |
    当前会话未绑定已确认的项目根；本轮不启用焦点、话题、scratch、logs 或后台监听。

    分级建档策略（参考 `init-project.md §1 四套架构套餐` 与 `§1.5 打开任意文件夹时的入口分类器`）：
    - 先判治理授权，再判文件夹角色，最后判套餐；有效 `.jiacong/project.json` 是唯一治理授权，旧 `.claude/`、`topics/`、`logs/` 只能作迁移线索。
    - 已有有效 `.jiacong/project.json`：进入该管理根治理分支；项目记录写在此根，源码或正文产物按内容层路径处理。
    - 当前目录有 `.git` 但无 `project.json`：默认按既有项目候选管理根处理，优先原位建档；若是代码、正文、HTML 或其他交付物生产项目，再建议启用 source layer / 双层 Git。理想实践是管理根普通 Git 管治理，source layer Git 管内容，不把管理根改造成 workspace 容器。
    - 当前目录无 Git 且为空：默认建议建立标准管理根；需要版本化治理时启用管理层 Git；需要独立管理源码、正文或 HTML 等产物时启用 source layer；双层 Git 的推荐组合是 `--init-management-git --source-workspace` 或快捷 `--dual-git`。
    - 当前目录无 Git 但已有历史文件：标准项目可原位 init；若历史文件应成为内容层，先提出迁入 source layer 的方案，用户确认前不移动、不包进 workspace。
    - 有 `.repo.git/` 且有 `main/` 或 `worktrees/`：这是 legacy 管理层 workspace 或既有容器结构线索；不在外层写 `topics/` 或 `logs/`，先判断其身份，再根据 workspace selection 定位内层已确认管理根并检查 `.jiacong/project.json`。新项目默认不推荐走这一路。
    - 只有旧痕迹、半建档结构、父目录多 repo 或混合 Git 模式：停止自动初始化，先做体检；不能自动选父目录建档，不能把内容层 Git/worktree 当作管理根授权。
    - 套餐按项目性质确认：学术论文 / 实证研究 / 代码项目 / 短平快；用户确认前不得创建 `.jiacong/project.json`。

    脚本只提供运行边界和入口分类参考；AI 负责解释和提案；用户拥有建档、Git 形态、source layer / 双层 Git 与结构迁移的决策权。

session.workspace_no_selection:
  text: "检测到 workspace 结构线索，但是否采用 workspace 模式需要用户决策；在确认项目根前，不能进入项目治理流程。"
