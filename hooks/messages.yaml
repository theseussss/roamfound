focus.missing.set:
  text: "  定位焦点：写入合法 JSON 到 {focus_path}，格式为 {\"schema_version\":1,\"topic_id\":\"NNN\",\"source\":\"manual\"}"
focus.not_found:
  text: "⚠️ 焦点 {topic_id} 指向不存在的话题。请重新定位或新建。"
